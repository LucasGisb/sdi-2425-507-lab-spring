spring.application.name=sdi-2425-507-spring
server.port = 8090

# Configuración de la base de datos en memoria HSQLDB
spring.datasource.url=jdbc:hsqldb:hsql://localhost:9001
spring.datasource.username=SA
spring.datasource.password=
spring.datasource.driver-class-name=org.hsqldb.jdbcDriver

#Configuracion de la paginacion.
# En la variable Page, se mete el atributo page/siez. Hay que establecerlo como parameter
spring.data.web.pageable.page-parameter=0
spring.data.web.pageable.size-parameter=5

spring.jpa.hibernate.ddl-auto=create
    #Con esto, cada vez que se inicie se reinicia las tablas
# Para no crear ninguna tabla, solo validar:
#spring.jpa.hibernate.ddl-auto=validate