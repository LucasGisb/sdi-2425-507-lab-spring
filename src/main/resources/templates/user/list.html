<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org">
<head th:replace="fragments/head"/> <!-- framento del head -->
<body>
<!-- Barra de Navegación superior -->
<nav th:replace="fragments/nav"/>
<div class="container">
  <h2>Usuarios</h2>
  <p>Los usuarios que actualmente figuran en el sistema son los
    siguientes:</p>
    <!-- Botón de actualización el fragmento de la tabla -->
  <button type="button" id="updateButton" class="btn btn-primary">Actualizar</button>
  <script>
    $( "#updateButton" ).click(function() {
      $("#usersTable").load('/user/list/update');
    });
  </script>

  <div class="table-responsive">
    <table class="table table-hover" id="usersTable" th:fragment="usersTable"> <!-- manera de identificar la tabla (para el Controller)-->
      <thead>
      <tr>
        <th scope="col">DNI</th>
        <th scope="col">Nombre</th>
        <th scope="col">Apellidos</th>
        <th scope="col"></th>
        <th scope="col"></th>
        <th scope="col"></th>
        <th scope="col"></th>
        <th scope="col"></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${usersList}">
        <td th:text="${user.dni}">71888888X</td>
        <td th:text="${user.name}">Nombre del alumno</td>
        <td th:text="${user.lastName}">Apellidos del alumno</td>
        <td><a th:href="${'/user/details/' + user.id}">detalles</a></td>
        <td><a th:href="${'/user/edit/' + user.id}">modificar</a></td>
        <td><a th:href="${'/user/delete/' + user.id}">eliminar</a></td>
      </tr>
      </tbody>
    </table>
  </div>
  <div th:if="${#lists.isEmpty(usersList)}"> No hay usuarios en la aplicacion en este momento</div>
</div>
<footer th:replace="fragments/footer"/>
</body>
</html>
